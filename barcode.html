<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receiving Scanner</title>
<!-- <script src="https://unpkg.com/@zxing/browser@latest"></script> -->
    <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
    <script src="./receiving-data.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
        }

        .success {
            background: #dff5e1;
            color: #176b2c;
        }

        .error {
            background: #ffe0e0;
            color: #9b1c1c;
        }

        #weightSection {
            display: none;
            margin-top: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        button:disabled {
            background: #999;
        }

        #newScanButton {
            display: none;
            background: #555;
        }

        .info {
            margin-top: 10px;
            font-size: 15px;
            color: #666;
            text-align: center;
        }

        .field-info {
            margin-top: 5px;
            font-size: 14px;
            color: #777;
        }
        #scannerContainer {
            position: relative;
            width: 100%;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        #scannerVideo {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #000;
        }

        .scannerGuide {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 100px;
            transform: translateY(-50%);

            border: 3px solid #fff;
            border-radius: 8px;

            box-sizing: border-box;

            color: white;
            text-align: center;
            padding-top: 105px;

            font-size: 14px;

            pointer-events: none;
        }

        #startScannerButton {
            position: relative;
            z-index: 5;
        }

        #startScannerButton.stop {
            background: #b00020;
        }

                /* Receiving status modal */
        #receivingStatusModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

                .receiving-modal-box {
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .receiving-modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .receiving-modal-details {
            font-size: 14px;
            line-height: 1.5;
            color: #444;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .receiving-modal-processing {
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Receiving</h1>

    <p id="instructionText" style="text-align:center;">
        Scan the receiving barcode
    </p>

    <div id="scannerContainer">

    <video
        id="scannerVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div class="scannerGuide">
        Place the barcode inside this area
    </div>

    <button id="startScannerButton">
        Start Camera
    </button>

</div>

<div class="result" id="resultBox">
    Scanned:
    <strong>Nothing yet</strong>
</div>


    <!-- =========================================
         RECEIVING INFORMATION
         Hidden until barcode is scanned
         ========================================= -->

    <div id="weightSection">

        <label for="weightInput">
            Gross Weight (Lbs)
        </label>

        <input
            type="number"
            id="weightInput"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="Enter gross weight"
        >

        <label for="commoditySelect">
            Item / Commodity
        </label>

        <select id="commoditySelect"></select>

        <div class="field-info" id="commodityDefaultText">
            Default: Loading...
        </div>

        <label for="packagingSelect">
            Packaging
        </label>

        <select id="packagingSelect"></select>

        <div class="field-info">
            Tare automatically changes with packaging.
        </div>

        <label>
            Tare Weight
        </label>

        <input
            type="text"
            id="tareDisplay"
            value="70 Lbs"
            readonly
        >

        <label for="workflowSelect">
            Workflow Step
        </label>

        <select id="workflowSelect"></select>

        <div class="field-info" id="workflowDefaultText">
            Default: Loading...
        </div>

        <div class="info" id="receivingSummary">
            Tare: 70 Lbs
        </div>

        <button id="submitWeightButton">
            Submit Receiving
        </button>

    </div>


    <button id="newScanButton">
        Scan Another Inbound
    </button>

</div>

<script>

    // =========================================
    // N8N WEBHOOK
    // =========================================

    const WEBHOOK_URL =
        "https://n8n.leadsking.ai/webhook/barcode-erp";


    // =========================================
    // FIXED / DEFAULT VALUES
    // =========================================

    const DEFAULT_COMMODITY_ID = 653;

    const DEFAULT_PACKAGING_ID = 19;

    const DEFAULT_TARE = 70;

    const DEFAULT_WORKFLOW_ID = 9;


    // =========================================
    // CURRENT BARCODE
    // =========================================

    let scannedBarcode = null;

    function getCommodityNameById(id) {
        const commodity = COMMODITIES.find(item => item.id === id);
        return commodity ? commodity.name : "Commodity";
    }

    function getPackagingNameById(id) {
        const packaging = PACKAGING_TYPES.find(item => item.id === id);
        return packaging ? packaging.name : "Packaging";
    }

    function getWorkflowNameById(id) {
        const workflow = WORKFLOW_STEPS.find(item => item.id === id);
        return workflow ? workflow.name : "Workflow";
    }

    function populateCommoditySelect() {
        const select = document.getElementById("commoditySelect");

        COMMODITIES.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.commodityId) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        const defaultText = document.getElementById("commodityDefaultText");
        defaultText.textContent =
            "Default: " + getCommodityNameById(RECEIVING_DEFAULTS.commodityId);
    }

    function populatePackagingSelect() {
        const select = document.getElementById("packagingSelect");

        PACKAGING_TYPES.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.dataset.tare = item.weight;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.packagingTypeId) {
                option.selected = true;
            }

            select.appendChild(option);
        });
    }

    function populateWorkflowSelect() {
        const select = document.getElementById("workflowSelect");

        WORKFLOW_STEPS.forEach((item) => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;

            if (item.id === RECEIVING_DEFAULTS.workflowStepId) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        const defaultText = document.getElementById("workflowDefaultText");
        defaultText.textContent =
            "Default: " + getWorkflowNameById(RECEIVING_DEFAULTS.workflowStepId);
    }

    function updateTareUI() {
        const packagingSelect = document.getElementById("packagingSelect");
        const selectedOption = packagingSelect.options[packagingSelect.selectedIndex];
        const tare = parseFloat(selectedOption?.dataset?.tare || 0);

        document.getElementById("tareDisplay").value = tare + " Lbs";
        document.getElementById("receivingSummary").innerText = "Tare: " + tare + " Lbs";
    }

    populateCommoditySelect();
    populatePackagingSelect();
    populateWorkflowSelect();
    updateTareUI();

    document.getElementById("packagingSelect")
        .addEventListener("change", updateTareUI);

// =========================================
// ZXING BARCODE SCANNER
// =========================================

let codeReader = null;
let scannerControls = null;
let scannerRunning = false;


// =========================================
// HANDLE SUCCESSFUL SCAN
// =========================================

function onScanSuccess(decodedText) {

    // Prevent duplicate scans
    if (scannedBarcode !== null) {
        return;
    }

    console.log("Barcode detected:", decodedText);

    scannedBarcode = decodedText;

    // Stop camera
    if (scannerControls) {
        scannerControls.stop();
        scannerControls = null;
    }

    scannerRunning = false;

    const video = document.getElementById("scannerVideo");

    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }

    document.getElementById("instructionText").innerText =
        "Enter receiving information";

    const resultBox = document.getElementById("resultBox");

    resultBox.className = "result success";

    resultBox.innerHTML = `
        Inbound Scanned<br>
        <strong>${decodedText}</strong>
    `;

    document.getElementById("weightSection").style.display = "block";

    document.getElementById("startScannerButton").style.display = "none";

    // Focus weight input
    setTimeout(() => {
        document.getElementById("weightInput").focus();
    }, 300);
}


// =========================================
// START CAMERA
// =========================================

async function startBarcodeScanner() {

    if (scannerRunning) {
        return;
    }

    const startButton =
        document.getElementById("startScannerButton");

    const video =
        document.getElementById("scannerVideo");

    startButton.disabled = true;
    startButton.innerText = "Starting Camera...";

    try {

        scannerRunning = true;

        // Create ZXing reader
        codeReader = new ZXingBrowser.BrowserMultiFormatOneDReader();

        console.log("Starting ZXing scanner...");

        /*
         * Use the rear/environment camera.
         *
         * "ideal" is intentionally used instead of "exact"
         * because different iPhones expose the camera
         * differently.
         */
        const constraints = {
            video: {
                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                }
            }
        };

        scannerControls =
            await codeReader.decodeFromConstraints(
                constraints,
                video,
                (result, error) => {

                    if (result) {

                        const text = result.getText();

                        console.log(
                            "ZXing detected barcode:",
                            text
                        );

                        onScanSuccess(text);

                    }

                    // Normal "not found yet" errors are ignored.
                    // ZXing continuously checks the camera.
                }
            );

        startButton.disabled = false;

        startButton.innerText =
            "Scanning...";

        startButton.classList.add("stop");

    } catch (error) {

        console.error(
            "Camera/scanner error:",
            error
        );

        scannerRunning = false;

        startButton.disabled = false;

        startButton.innerText =
            "Start Camera";

        alert(
            "Unable to start the camera.\n\n" +
            "Please make sure camera permission is allowed " +
            "for this website and try again."
        );
    }
}


// =========================================
// START BUTTON
// =========================================

document
    .getElementById("startScannerButton")
    .addEventListener(
        "click",
        startBarcodeScanner
    );


    document
    .getElementById("submitWeightButton")
    .addEventListener("click", async function () {

        const weightInput =
            document.getElementById("weightInput");

        const weight =
            parseFloat(weightInput.value);

        const commoditySelect =
            document.getElementById("commoditySelect");

        const packagingSelect =
            document.getElementById("packagingSelect");

        const workflowSelect =
            document.getElementById("workflowSelect");


        // =========================================
        // VALIDATION
        // =========================================

        if (!scannedBarcode) {

            alert(
                "Please scan an inbound barcode first."
            );

            return;
        }


        if (!weight || weight <= 0) {

            alert(
                "Please enter a valid gross weight."
            );

            weightInput.focus();

            return;
        }


        const commodityId =
            Number(commoditySelect.value);

        const packagingTypeId =
            Number(packagingSelect.value);

        const workflowStepId =
            Number(workflowSelect.value);


        const selectedPackaging =
            packagingSelect.options[
                packagingSelect.selectedIndex
            ];

        const weightTare =
            parseFloat(
                selectedPackaging.dataset.tare || 0
            );


        if (weight < weightTare) {

            alert(
                "Gross weight cannot be less than " +
                weightTare +
                " Lbs tare."
            );

            weightInput.focus();

            return;
        }


        // =========================================
        // DISPLAY INFORMATION
        // =========================================

        const netWeight =
            weight - weightTare;

        const commodityName =
            getCommodityNameById(commodityId);

        const packagingName =
            getPackagingNameById(packagingTypeId);

        const workflowName =
            getWorkflowNameById(workflowStepId);


        const button =
            document.getElementById(
                "submitWeightButton"
            );

        const resultBox =
            document.getElementById(
                "resultBox"
            );


        // =========================================
        // DISABLE SUBMIT
        // =========================================

        button.disabled = true;

        button.innerText =
            "Processing...";


        // =========================================
// SHOW "SENT" MODAL
// =========================================

const receivingStatusModal =
    document.getElementById(
        "receivingStatusModal"
    );

const receivingModalDetails =
    document.getElementById(
        "receivingModalDetails"
    );

receivingModalDetails.innerHTML = `
    Inbound: ${scannedBarcode}<br>
    Gross: ${weight.toFixed(2)} Lbs<br>
    Tare: ${weightTare.toFixed(2)} Lbs<br>
    Net: ${netWeight.toFixed(2)} Lbs<br>
    Item: ${commodityName}<br>
    Packaging: ${packagingName}<br>
    Workflow: ${workflowName}
`;

receivingStatusModal.style.display = "flex";

document
    .getElementById("instructionText")
    .innerText =
        "Processing receiving";


        // =========================================
        // DATA SENT TO N8N
        // =========================================

        const receivingData = {

            barcode:
                scannedBarcode,

            weightReceived:
                weight,

            commodityId:
                commodityId,

            packagingTypeId:
                packagingTypeId,

            weightTare:
                weightTare,

            workflowStepId:
                workflowStepId
        };


        console.log(
            "Sending to n8n:",
            receivingData
        );


       // =========================================
// SEND TO N8N
// =========================================

try {

    const sentAt = Date.now();

    const response =
        await fetch(
            WEBHOOK_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        receivingData
                    )
            }
        );


    const text =
        await response.text();


    console.log(
        "Raw n8n response:",
        text
    );


    // Make sure "Receiving Sent" stays
    // on screen for at least 2 seconds.
    const elapsed =
        Date.now() - sentAt;

    const remaining =
        Math.max(
            0,
            2000 - elapsed
        );

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                remaining
            )
    );


    let data = {};

    if (text) {

        try {

            data =
                JSON.parse(text);

        } catch (parseError) {

            console.error(
                "Could not parse n8n response:",
                parseError
            );

            throw new Error(
                "Invalid response received from n8n."
            );
        }
    }


    // =========================================
    // HTTP ERROR
    // =========================================

    if (!response.ok) {

        throw new Error(
            data.message ||
            "n8n returned HTTP " +
            response.status
        );
    }


    console.log(
        "Receiving response:",
        data
    );


// =========================================
// N8N / RAZOR ERROR
// =========================================

if (data.success === false) {

    receivingStatusModal.style.display = "flex";

    document.querySelector(".receiving-modal-title").innerText =
        "Receiving Failed";

    document.querySelector(".receiving-modal-processing").innerText =
        "Please review the error";

    receivingModalDetails.innerHTML = `
        <div style="
            font-size:14px;
            line-height:1.5;
            overflow-wrap:anywhere;
        ">
            <strong>Inbound:</strong> ${scannedBarcode}<br><br>

            <strong>Error:</strong><br>
            ${data.message ||
              "The receiving could not be completed."}
        </div>
    `;

    document.getElementById("instructionText").innerText =
        "Receiving failed";

    button.disabled = false;
    button.innerText = "Submit Receiving";

    return;
}


// =========================================
// SUCCESS
// =========================================

receivingStatusModal.style.display = "flex";

document.querySelector(".receiving-modal-title").innerText =
    "Receiving Completed";

document.querySelector(".receiving-modal-processing").innerText =
    "Receiving completed successfully";

receivingModalDetails.innerHTML = `
    <div style="
        font-size:14px;
        line-height:1.6;
        overflow-wrap:anywhere;
    ">
        <strong>Inbound:</strong> ${scannedBarcode}<br>
        <strong>Gross:</strong> ${weight.toFixed(2)} Lbs<br>
        <strong>Tare:</strong> ${weightTare.toFixed(2)} Lbs<br>
        <strong>Net:</strong> ${netWeight.toFixed(2)} Lbs<br>
        <strong>Item:</strong> ${commodityName}<br>
        <strong>Packaging:</strong> ${packagingName}<br>
        <strong>Workflow:</strong> ${workflowName}<br><br>

        <strong>System Response:</strong><br>
        ${data.message ||
          "Receiving completed successfully."}
    </div>
`;

document.getElementById("instructionText").innerText =
    "Receiving successfully submitted";

document.getElementById("weightSection").style.display =
    "none";

document.getElementById("newScanButton").style.display =
    "block";

button.disabled = true;
button.innerText = "Completed";


} catch (error) {

    // Hide modal if an unexpected error occurs
    receivingStatusModal.style.display =
        "none";


    console.error(
        "Error submitting receiving:",
        error
    );


    resultBox.className =
        "result error";


    resultBox.innerHTML = `

        <strong>
            Submission Failed
        </strong>

        <br><br>

        <span style="
            font-size:14px;
            line-height:1.5;
            overflow-wrap:anywhere;
        ">
            Inbound: ${scannedBarcode}
        </span>

        <br><br>

        <span style="
            font-size:14px;
            line-height:1.5;
            overflow-wrap:anywhere;
        ">
            ${error.message ||
              "Unable to communicate with the receiving system."}
        </span>
    `;


    document
        .getElementById(
            "instructionText"
        )
        .innerText =
            "Submission failed";


    button.disabled =
        false;

    button.innerText =
        "Submit Receiving";
}
    });

    document.getElementById("newScanButton").addEventListener("click", function () {
        location.reload();
    });
</script>
<!-- Receiving Sent Modal -->
<div id="receivingStatusModal">

    <div class="receiving-modal-box">

        <div class="receiving-modal-title">
            Receiving Sent
        </div>

        <div
            id="receivingModalDetails"
            class="receiving-modal-details"
        ></div>

        <div class="receiving-modal-processing">
            Processing...
        </div>

    </div>

</div>
</body>
</html>
